name: Build EdgeSnapper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with MSVC
        run: |
          cl.exe edgeSnapper.cpp /Fe:edgeSnapper.exe /O2 /static /D_CRT_SECURE_NO_WARNINGS kernel32.lib advapi32.lib psapi.lib dbghelp.lib
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: edgeSnapper.exe
          path: edgeSnapper.exe
